[project]
name = "invoice-ocr"
version = "0.1.0"
description = "Extraction des lignes de total de factures PDF vers un export Excel consolidé"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
invoice-ocr = "invoice_ocr.extraction:main"
invoice-ocr-compare = "invoice_ocr.comparison:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
